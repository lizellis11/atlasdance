<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: white; }
    .logo-lockup {
      display: inline-flex;
      align-items: center;
      gap: 40px;
      padding: 60px;
    }
    .logo-img {
      height: 400px;
      width: auto;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
    }
    .logo-atlas {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: 120px;
      letter-spacing: 0.2em;
      line-height: 0.95;
      color: #0D0D0D;
    }
    .logo-dance {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 138px;
      letter-spacing: 0.15em;
      line-height: 0.95;
      color: #C9A84C;
    }
  </style>
</head>
<body>
  <div class="logo-lockup">
    <img class="logo-img" src="logo-black.png" alt="" />
    <div class="logo-text">
      <span class="logo-atlas">ATLAS</span>
      <span class="logo-dance">Dance</span>
    </div>
  </div>
</body>
</html>
