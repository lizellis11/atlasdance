<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Logo Test — Atlas Dance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --black:      #0D0D0D;
      --dark:       #141414;
      --charcoal:   #1E1E1E;
      --gold:       #C9A84C;
      --gold-light: #E8C96A;
      --ivory:      #F2EDE4;
      --muted:      #A39A8C;
      --border:     rgba(201, 168, 76, 0.2);
      --font-logo:  'Cinzel', Georgia, serif;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:  'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--black);
      color: var(--ivory);
      font-family: var(--font-body);
    }

    /* --- Toggle Bar --- */
    .toggle-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      background: rgba(13, 13, 13, 0.95);
      border-bottom: 1px solid var(--border);
    }

    .toggle-btn {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.7rem 1.5rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--gold);
      color: var(--black);
      border-color: var(--gold);
    }

    /* --- Hero Section --- */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: var(--black);
    }

    .hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(13, 13, 13, 0.90) 40%,
        rgba(13, 13, 13, 0.40) 100%
      );
    }

    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0.7;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      gap: 1.8rem;
      padding: 8rem 2rem 4rem;
      margin-left: max(1rem, calc((100vw - 1100px) / 2 - 2rem));
      max-width: 900px;
    }

    /* --- Logo Image --- */
    .hero-logo-img {
      flex-shrink: 0;
      /* Height spans from top of "A" in Atlas down to the tagline */
      align-self: flex-start;
      height: auto;
      object-fit: contain;
      transition: opacity 0.3s;
      /* Sized to span from eyebrow through tagline */
      margin-top: 2rem;
    }

    .hero-logo-img.hidden {
      display: none;
    }

    /* --- Text Block --- */
    .hero-text {
      flex: 1;
    }

    .hero-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.5rem;
    }

    .hero-title {
      font-family: var(--font-logo);
      font-size: clamp(3rem, 7vw, 6rem);
      font-weight: 400;
      letter-spacing: 0.2em;
      line-height: 0.95;
      color: var(--ivory);
      margin-bottom: 2rem;
    }

    .hero-title em {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 300;
      font-size: 1.15em;
      letter-spacing: 0.15em;
      color: var(--gold);
    }

    .hero-tagline {
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      font-style: italic;
      color: rgba(242, 237, 228, 0.75);
      max-width: 480px;
      line-height: 1.5;
      margin-bottom: 3rem;
    }

    .hero-actions {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 1rem 2.2rem;
      border-radius: 2px;
      text-decoration: none;
      transition: all 0.25s;
      min-height: 44px;
    }

    .btn--gold {
      background: var(--gold);
      color: var(--black);
    }

    .btn--outline {
      border: 1px solid var(--gold);
      color: var(--gold);
    }

    /* --- Responsive --- */
    @media (max-width: 700px) {
      .hero-content {
        flex-direction: column;
        text-align: center;
        margin-left: 0;
        padding: 7rem 1.5rem 3rem;
        align-items: center;
      }

      .hero-logo-img {
        width: 120px;
      }

      .hero-actions {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Toggle -->
  <div class="toggle-bar">
    <button class="toggle-btn" onclick="showLogo('draft1')">Logo Draft 1</button>
    <button class="toggle-btn active" onclick="showLogo('draft2')">V2 Draft 2 (Print)</button>
    <button class="toggle-btn" onclick="showLogo('none')">No Logo (Current)</button>
  </div>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-bg">
      <img src="../hero.jpg" alt="Ballroom dancers performing an elegant lift on a competition floor" />
    </div>

    <div class="hero-content">
      <img id="logo-draft1" class="hero-logo-img hidden" src="logo-draft-1-white.png" alt="Atlas Dance logo — dancer silhouette holding globe" />
      <img id="logo-draft2" class="hero-logo-img" src="logo-v2-draft2-white.png" alt="Atlas Dance logo — dancer silhouette holding globe" />

      <div class="hero-text">
        <p class="hero-eyebrow">Utah's Premier Private Ballroom Studio</p>
        <h1 class="hero-title">
          Atlas<br /><em>Dance</em>
        </h1>
        <p class="hero-tagline">
          "The world on your shoulders.<br />
          The story in your bones."
        </p>
        <div class="hero-actions">
          <a href="#" class="btn btn--gold">Apply for a Spot</a>
          <a href="#" class="btn btn--outline">Meet Dexter</a>
        </div>
      </div>
    </div>
  </section>

  <script>
    function showLogo(which) {
      const d1 = document.getElementById('logo-draft1');
      const d2 = document.getElementById('logo-draft2');

      d1.classList.add('hidden');
      d2.classList.add('hidden');

      if (which === 'draft1') d1.classList.remove('hidden');
      if (which === 'draft2') d2.classList.remove('hidden');

      document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      sizeLogo();
    }

    function sizeLogo() {
      const title = document.querySelector('.hero-title');
      const tagline = document.querySelector('.hero-tagline');
      const logos = document.querySelectorAll('.hero-logo-img:not(.hidden)');

      if (!title || !tagline || logos.length === 0) return;

      const top = title.getBoundingClientRect().top;
      const bottom = tagline.getBoundingClientRect().bottom;
      const span = bottom - top;

      logos.forEach(logo => {
        logo.style.height = (span * 1.14) + 'px';
        logo.style.width = 'auto';
        logo.style.marginTop = '0';
      });
    }

    window.addEventListener('load', sizeLogo);
    window.addEventListener('resize', sizeLogo);
  </script>

</body>
</html>
