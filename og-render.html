<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #0D0D0D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .title-row {
      display: flex;
      align-items: baseline;
      gap: 0.35em;
    }
    .atlas {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: 144px;
      letter-spacing: 0.2em;
      color: #F2EDE4;
      line-height: 1;
    }
    .dance {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 165px;
      letter-spacing: 0.15em;
      color: #C9A84C;
      line-height: 1;
    }
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 27px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #A39A8C;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="title-row">
    <span class="atlas">ATLAS</span>
    <span class="dance">Dance</span>
  </div>
  <div class="subtitle">Dexter Ellis</div>
</body>
</html>
